<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nadeem Shaikh - Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        .card {
            background-color: #1e293b;
            padding: 28px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 320px;
            width: 85%;
        }
        h1 { color: #38bdf8; margin-bottom: 6px; font-size: 24px; }
        .bio { color: #94a3b8; font-size: 14px; margin-bottom: 20px; line-height: 1.4; }
        .links-container { display: flex; flex-direction: column; gap: 10px; }
        .btn-link {
            display: block;
            background: #0284c7;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-link:hover {
            background: #0369a1;
        }
        .tag {
            display: inline-block;
            background: #334155;
            color: #38bdf8;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 18px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Nadeem Shaikh</h1>
        <p class="bio">Welcome to my personal portfolio website. IT & Hardware enthusiast.</p>
        
        <div class="links-container">
            <a href="https://instagram.com" target="_blank" class="btn-link">Instagram</a>
            <a href="https://linkedin.com" target="_blank" class="btn-link">LinkedIn</a>
            <a href="https://youtube.com" target="_blank" class="btn-link">YouTube</a>
            <a href="mailto:ns2685151@gmail.com" class="btn-link">Contact Me</a>
        </div>

        <div class="tag">Active & Online</div>
    </div>
</body>
</html>
